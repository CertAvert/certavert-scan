  # A tag like v0.1.2 publishes a GitHub release, with the tag's message as its notes.
  # Create the tag with: git tag -a v0.1.2 -F notes.txt && git push origin v0.1.2
  name: Release

  on:
    push:
      tags: ["v*"]

  permissions:
    contents: write

  jobs:
    release:
      runs-on: ubuntu-latest
      steps:
        - name: Publish the release
          env:
            GH_TOKEN: ${{ github.token }}
            TAG: ${{ github.ref_name }}
          run: |
            sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq 'select(.object.type == "tag") | .object.sha')
            test -n "$sha" || { echo "$TAG is not an annotated tag (git tag -a)"; exit 1; }
            gh api "repos/$GITHUB_REPOSITORY/git/tags/$sha" --jq .message > notes.md
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "certavert-scan ${TAG#v}" --notes-file notes.md --verify-tag
